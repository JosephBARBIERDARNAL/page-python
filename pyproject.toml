[project]
name = "py-page"
version = "0.1.0"
description = "Python bindinds to page"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Joseph Barbier", email = "joseph@ysunflower.com" },
]
keywords = ["a", "keywords", "list", "of"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3"
]
dependencies = []

[project.urls]
Documentation = "https://josephbarbierdarnal.github.io/py-page/"
Homepage = "https://josephbarbierdarnal.github.io/py-page/"
Issues = "https://github.com/josephbarbierdarnal/py-page/issues"
Repository = "https://github.com/josephbarbierdarnal/py-page"

[dependency-groups]
dev = [
  "coverage>=7.9.1",
  "genbadge>=1.1.2",
  "prek>=0.3.2",
  "pytest>=8.3.5",
  "ruff>=0.11.13",
  "ty>=0.0.15",
]

[tool.setuptools]
packages = ["page"]

[tool.uv.sources]
page = { workspace = true }
